<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Harvest Admin</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Security check
        if (localStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
</head>

<body>
    <header>
        <div class="container nav">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Harvest Logo">
            </a>
            <div class="nav-links">
                <a href="index.html">عرض الموقع</a>
                <a href="#" id="logoutBtn" style="color: var(--danger);">تسجيل الخروج</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="admin-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <h2 style="margin: 0;">إدارة المنتجات</h2>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <input type="text" id="adminSearchInput" placeholder="بحث بالاسم أو المادة الفعالة..."
                    style="padding: 0.7rem 1.2rem; border-radius: 50px; border: 1px solid #e2e8f0; width: 250px; font-size: 0.9rem;">
                <button class="btn btn-primary" onclick="openModal()">
                    <span>+</span> إضافة منتج جديد
                </button>
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>اسم المنتج</th>
                        <th>السعر (ج.م)</th>
                        <th>الكمية</th>
                        <th>تاريخ الانتهاء</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="adminProductTable">
                    <!-- Data injected by admin.js -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" style="color: var(--primary);">إضافة منتج</h2>
                <p style="color: var(--text-light); font-size: 0.9rem;">أدخل تفاصيل المنتج بدقة ليظهر بشكل صحيح للعملاء
                </p>
            </div>

            <form id="productForm">
                <input type="hidden" id="productId">

                <div class="form-group">
                    <label for="name">اسم المنتج</label>
                    <input type="text" id="name" placeholder="مثلاً: Nitrogen Plus" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="category">التصنيف</label>
                        <select id="category" required onchange="toggleFields()">
                            <option value="">اختر التصنيف</option>
                            <optgroup label="مبيدات">
                                <option value="مبيد حشرى">مبيد حشرى</option>
                                <option value="مبيد فطري">مبيد فطري</option>
                                <option value="مبيد اكاروسى">مبيد اكاروسى</option>
                                <option value="مبيد حشائش">مبيد حشائش</option>
                            </optgroup>
                            <optgroup label="أسمدة زراعية">
                                <option value="npk">npk</option>
                                <option value="أسمدة متخصصة">أسمدة متخصصة</option>
                                <option value="منظم نمو">منظم نمو</option>
                                <option value="محسنات تربة">محسنات تربة</option>
                            </optgroup>
                        </select>
                    </div>

                    <div id="ingredientGroup" class="form-group" style="display: none; grid-column: 1 / -1;">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <label id="ingredientLabel" for="ingredientList" style="margin-bottom: 0;">المادة الفعالة /
                                التركيب</label>
                            <button type="button" class="btn btn-ghost" onclick="addIngredientField()"
                                style="padding: 0.2rem 0.6rem; font-size: 1.2rem; border-radius: 8px;">+</button>
                        </div>
                        <div id="ingredientContainer">
                            <!-- Dynamic inputs will be injected here -->
                        </div>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="cartonContent">محتوى الكرتونة</label>
                        <input type="text" id="cartonContent" placeholder="12 عبوة">
                    </div>
                    <div class="form-group">
                        <label for="packageSize">حجم العبوة</label>
                        <input type="text" id="packageSize" placeholder="1 لتر">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="useRate">معدل الاستخدام</label>
                        <input type="text" id="useRate" placeholder="مثلاً: 250 سم / 100 لتر">
                    </div>
                    <div class="form-group">
                        <label for="importer">الشركة المستوردة</label>
                        <input type="text" id="importer" placeholder="اسم الشركة المستوردة">
                    </div>
                </div>

                <div class="form-group">
                    <label for="origin">المنشأ</label>
                    <input type="text" id="origin" placeholder="مثلاً: اسبانيا - الصين">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="price">السعر (ج.م)</label>
                        <input type="number" id="price" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">الكمية المتاحة</label>
                        <input type="number" id="quantity" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="expiry">تاريخ الانتهاء</label>
                    <input type="date" id="expiry" required>
                </div>

                <div class="form-group"
                    style="display: flex; align-items: center; gap: 0.5rem; background: #f8faf8; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem;">
                    <input type="checkbox" id="isPopular" style="width: auto;">
                    <label for="isPopular" style="margin-bottom: 0; cursor: pointer;">أضف هذا المنتج إلى "الأكثر رواجاً"
                        (سيعرض في واجهة الموقع الأساسية)</label>
                </div>

                <div class="form-group">
                    <label for="productImage">رابط صورة المنتج</label>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <input type="text" id="productImage" placeholder="https://example.com/image.jpg"
                            style="padding: 0.8rem;" oninput="updateImagePreview(this.value)">
                        <div id="imagePreview" style="max-width: 100px; display: none; margin-top: 0.5rem;">
                            <img src="" id="previewImg"
                                style="width: 100%; border-radius: 8px; border: 1px solid #ddd;">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" style="flex: 2; justify-content: center;">
                        <span>💾</span> حفظ المنتج
                    </button>
                    <button type="button" class="btn btn-ghost" onclick="closeModal()"
                        style="flex: 1; justify-content: center;">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="admin.js"></script>
</body>

</html>
